name: Release Theme

on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from tag
        id: tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update style.css version
        run: |
          sed -i "s/Version: .*/Version: ${{ steps.tag.outputs.version }}/" style.css

      - name: Prepare production files
        run: |
          mkdir production

          cp -R assets production/assets
          cp -R inc production/inc

          cp functions.php production/functions.php
          cp updater.php production/updater.php
          cp style.css production/style.css

          if [ -f screenshot.png ]; then
            cp screenshot.png production/screenshot.png
          fi

      - name: Build release ZIP
        run: |
          cd production
          zip -r ../rrh-divi-child.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          files: rrh-divi-child.zip
